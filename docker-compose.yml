services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - backend_venv:/opt/venv
      # Host vault path from .env (see .env.example) → /vault in the container.
      - ${OBSIDIAN_VAULT_PATH}:/vault:rw
    environment:
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    # Use a compose-local venv and run the backend package module.
    command:
      - sh
      - -c
      - |
        if [ ! -x /opt/venv/bin/python ]; then
          python -m venv /opt/venv
          pip install -q -r requirements.txt
        fi
        python -c "from backend.main import run_app; run_app(host='0.0.0.0')"
    # Bind on all interfaces so other devices on the LAN can reach the API.
    ports:
      - "0.0.0.0:8765:8765"

  frontend:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    ports:
      - "0.0.0.0:1234:1234"
    depends_on:
      - backend

volumes:
  backend_venv:
  frontend_node_modules:
