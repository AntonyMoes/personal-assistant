# Copy to config.yaml and adjust. Secrets: see .env.example; YAML supports ${VAR} substitution.

server:
  host: "127.0.0.1"
  port: 8765

# Default user id when no auth is used (single-user mode).
app:
  default_user_id: "default"
  # Stable model persona (repo-relative or absolute). Injected as the first system message each turn.
  system_prompt_path: "prompts/system.md"
  # Obsidian vault root (optional; for obsidian tool).
  # - Docker Compose: keep "/vault". Host path belongs in .env as OBSIDIAN_VAULT_PATH
  #   (compose mounts it at /vault). Do NOT put ${OBSIDIAN_VAULT_PATH} here — that is the
  #   host path and would break inside the container.
  # - Local (no Docker): set a host path, e.g. "C:/Users/you/Documents/ObsidianVault".
  obsidian_vault_path: "/vault"

# Storage: "file" persists chats/memories under data/ (recommended). "memory" is ephemeral (tests/dev).
# Note: EmbeddingStore is always in-memory today (RAG scaffolding; see AGENTS.md).
storage:
  backend: "file"
  base_path: "data"
  chats_dir: "chats"
  memories_dir: "memories"
  embeddings_dir: "embeddings"

# Model provider. Possible values: openai, stub.
# - openai: uses OpenAI API (set OPENAI_API_KEY or model.openai_api_key).
# - stub: no API calls; streams a fixed message (for development/tests).
model:
  provider: "stub"
  default_model: "stub"
  # openai_api_key: "${OPENAI_API_KEY}"

# Permission defaults per capability: allow | ask | ask_once_per_chat | deny
permissions:
  defaults:
    filesystem_read: "ask"
    filesystem_write: "ask"
    web_search: "ask"
    obsidian_read: "ask"
    obsidian_modify: "ask"
