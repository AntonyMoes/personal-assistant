# Copy to config.yaml and adjust. Secrets (e.g. API keys) can be set via environment variables.

server:
  host: "127.0.0.1"
  port: 8765

# Default user id when no auth is used (single-user mode).
# obsidian_vault_path: path to Obsidian vault root (optional; for obsidian tool).
app:
  default_user_id: "default"
  # obsidian_vault_path: "path/to/vault"

# Storage: backend "memory" (default) or "file". If "file", chats and memories persist to disk.
storage:
  backend: "memory"
  base_path: "data"
  chats_dir: "chats"
  memories_dir: "memories"
  embeddings_dir: "embeddings"

# Model provider. Possible values: openai, stub.
# - openai: uses OpenAI API (set OPENAI_API_KEY or model.openai_api_key).
# - stub: no API calls; streams a fixed message (for development/tests).
model:
  provider: "stub"
  default_model: "stub"
  # openai_api_key: "${OPENAI_API_KEY}"

# Permission defaults per capability: ask | ask_once | allow | deny
permissions:
  defaults:
    filesystem_read: "ask"
    filesystem_write: "ask"
    web_search: "ask"
    obsidian_read: "ask"
    obsidian_modify: "ask"
