# Copy to config.yaml and adjust. Secrets: see .env.example; YAML supports ${VAR} substitution.

server:
  host: "127.0.0.1"
  port: 8765

# Default user id when no auth is used (single-user mode).
app:
  default_user_id: "default"
  # Stable model persona (repo-relative or absolute). Injected as the first system message each turn.
  system_prompt_path: "prompts/system.md"
  # Obsidian vault root (optional; for obsidian tool).
  # - Docker Compose: keep "/vault". Host path belongs in .env as OBSIDIAN_VAULT_PATH
  #   (compose mounts it at /vault). Do NOT put ${OBSIDIAN_VAULT_PATH} here — that is the
  #   host path and would break inside the container.
  # - Local (no Docker): set a host path, e.g. "C:/Users/you/Documents/ObsidianVault".
  obsidian_vault_path: "/vault"

# Storage: "file" persists chats/memories/embeddings under data/ (recommended). "memory" is ephemeral (tests/dev).
# EmbeddingStore is file-backed when backend is file; used by Obsidian semantic/hybrid search.
storage:
  backend: "file"
  base_path: "data"
  chats_dir: "chats"
  memories_dir: "memories"
  embeddings_dir: "embeddings"

# Model provider. Possible values: openai, stub.
# - openai: uses OpenAI API (set OPENAI_API_KEY or model.openai_api_key).
# - stub: no API calls; streams a fixed message (for development/tests).
model:
  provider: "stub"
  default_model: "stub"
  # openai_api_key: "${OPENAI_API_KEY}"

# Chat-history window sent to the model (persona/memories prefix is not trimmed here).
# max_messages / max_chars of 0 = unlimited for that dimension.
context:
  max_messages: 40
  max_chars: 0
  summarize_overflow: true
  summary_message_chars: 200
  summary_max_chars: 2000

# Memory injection (ephemeral system block after persona). No embeddings yet.
# profile_keys: always included when present. retrieve_top_k: keyword+recency for the rest.
memories:
  profile_keys:
    - timezone
    - locale
    - language
  retrieve_top_k: 8
  candidate_limit: 100

# Obsidian vault indexing + semantic/hybrid search (obsidian tool search mode=).
obsidian_rag:
  namespace: "obsidian"
  chunk_chars: 1600
  chunk_overlap_chars: 200
  embed_batch_size: 64
  search_top_k: 8
  # Max files refreshed per semantic/hybrid search (0 = all stale/new files).
  ensure_index_max_files: 0

# Permission defaults per capability: allow | ask | ask_once_per_chat | deny
permissions:
  defaults:
    filesystem_read: "ask"
    filesystem_write: "ask"
    web_search: "ask"
    obsidian_read: "ask"
    obsidian_modify: "ask"
